name: Keep Alive

on:
  schedule:
    # 3일마다 UTC 00:00 (한국 시간 오전 9:00)에 실행
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push empty commit
        run: |
          git commit --allow-empty -m "chore: keep alive for Streamlit [skip ci]"
          git push
